<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一链 YiLink · 主题预览 v2（8 主题 × 2 布局）</title>
<style>
  /* ============ 预览页外壳（不随主题变化） ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #ECECEE;
    color: #222;
    min-height: 100vh;
  }
  .chrome {
    position: sticky; top: 0; z-index: 10;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #DDDDE2;
    padding: 12px 16px;
  }
  .chrome-inner { max-width: 480px; margin: 0 auto; }
  .chrome h2 { font-size: 13px; font-weight: 600; color: #555; margin-bottom: 10px; }
  .theme-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .theme-pill {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1.5px solid #D4D4DA; border-radius: 999px;
    background: #fff; padding: 5px 12px 5px 6px;
    font-size: 12px; cursor: pointer; color: #333;
  }
  .theme-pill .swatches { display: inline-flex; }
  .theme-pill .swatches i {
    width: 14px; height: 14px; border-radius: 50%;
    border: 1px solid rgba(0,0,0,.12); display: inline-block;
  }
  .theme-pill .swatches i + i { margin-left: -5px; }
  .theme-pill.active { border-color: #222; font-weight: 600; }
  .layout-bar { display: flex; gap: 8px; }
  .layout-btn {
    border: 1.5px solid #D4D4DA; background: #fff; border-radius: 8px;
    padding: 6px 18px; font-size: 13px; cursor: pointer; color: #333;
  }
  .layout-btn.active { background: #222; color: #fff; border-color: #222; }
  .hint { font-size: 11px; color: #999; margin-top: 8px; }

  /* ============ 主题作用域：.page 以下全部走 CSS 变量 ============ */
  .stage { display: flex; justify-content: center; padding: 24px 12px 48px; }
  .page {
    --card: #fff; --text: #161616; --subtext: #666664; --hairline: #e5e5e1;
    --accent: #1c1c1a; --accent-on: #fff;
    --shadow: 0 8px 30px rgba(0,0,0,.06);
    --r-card: 20px; --r-avatar: 50%; --gap: 12px;
    --d-size: 36px; --d-weight: 800; --d-track: -0.02em;
    --s-size: 17px; --s-weight: 700;
    --b-size: 15px; --b-weight: 400;
    --c-size: 12px; --c-weight: 400;
    width: 100%; max-width: 480px; min-height: 760px;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--text);
    padding: 40px 16px 56px;
    transition: background .25s ease;
  }

  /* ---- 通用 ---- */
  .card {
    background: var(--card);
    border-radius: var(--r-card);
    box-shadow: var(--shadow);
  }
  .sec-title {
    font-size: var(--s-size); font-weight: var(--s-weight);
    color: var(--accent); letter-spacing: -0.01em;
    margin: 0 4px 10px;
  }
  .caption {
    font-size: var(--c-size); font-weight: var(--c-weight);
    color: var(--subtext); text-align: center;
  }
  .flow > * + * { margin-top: var(--gap); }
  .flow > .group { margin-top: calc(var(--gap) + 8px); }

  /* ---- 1. 身份卡（不对称：大字居左，头像右上错位悬置） ---- */
  .identity {
    position: relative;
    padding: 26px 24px 24px;
    margin-top: 18px; /* 给悬置头像让位 */
  }
  .identity .name-zone { padding-right: 104px; }
  .identity h1 {
    font-size: var(--d-size); font-weight: var(--d-weight);
    letter-spacing: var(--d-track); line-height: 1.1;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .identity .role {
    margin-top: 8px; font-size: 14px; color: var(--subtext);
  }
  .identity .avatar {
    position: absolute; top: -18px; right: 20px;
    width: 84px; height: 84px;
    border-radius: var(--r-avatar);
    background: var(--accent); color: var(--accent-on);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 700;
    box-shadow: var(--shadow);
  }
  .identity .bio {
    margin-top: 18px; font-size: var(--b-size); font-weight: var(--b-weight);
    line-height: 1.75;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ---- 2. 主链接组（白纸卡 + 内容色缩略图 + →） ---- */
  .link-cards { display: flex; flex-direction: column; gap: var(--gap); }
  .link-card {
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border-radius: var(--r-card);
    box-shadow: var(--shadow);
    padding: 14px 16px;
    text-decoration: none; cursor: pointer;
    transition: transform .12s ease;
  }
  .link-card:active { transform: scale(.985); }
  .link-card .thumb {
    flex: none; width: 52px; height: 52px; border-radius: 12px;
    background: color-mix(in srgb, var(--subtext) 10%, var(--card));
    border: 1px solid var(--hairline);
    display: flex; align-items: center; justify-content: center;
    color: var(--subtext);
  }
  .link-card .link-text { flex: 1; min-width: 0; }
  .link-card .link-text strong {
    display: block; font-size: 15px; font-weight: 600; color: var(--text);
  }
  .link-card .link-text small {
    display: block; margin-top: 3px; font-size: 13px; color: var(--subtext);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .link-card .arrow { flex: none; font-size: 16px; color: var(--subtext); }

  /* 网格模式：仅第 2 组变 MD/LG 磁贴，卡面仍是白纸 */
  .page[data-layout="grid"] .link-cards {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap);
  }
  .page[data-layout="grid"] .link-card.lg { grid-column: span 2; }
  .page[data-layout="grid"] .link-card.md {
    flex-direction: column; align-items: flex-start; gap: 12px;
    min-height: 148px; padding: 16px;
  }
  .page[data-layout="grid"] .link-card.md .arrow { display: none; }
  .page[data-layout="grid"] .link-card.md .link-text small { white-space: normal; }

  /* ---- 3. 平台贴纸卡（4-3 阵列） ---- */
  .stickers { padding: 20px 20px 16px; }
  .stickers .sec-title { margin: 0 0 16px; }
  .sticker-grid {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 16px 18px; max-width: 284px; margin: 0 auto;
  }
  .sticker {
    flex: none; width: 56px; height: 56px; border-radius: 50%;
    display: block; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    transition: transform .12s ease;
  }
  .sticker:active { transform: scale(.94); }
  .sticker svg { display: block; width: 100%; height: 100%; }
  .stickers .caption { margin-top: 16px; }

  /* ---- 4. 微信卡 ---- */
  .wechat { padding: 16px 18px 14px; }
  .wechat .row { display: flex; align-items: center; gap: 12px; }
  .wechat .wx-icon {
    flex: none; width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--hairline);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
  }
  .wechat .wx-id {
    flex: 1; min-width: 0;
    font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: .01em;
  }
  .wechat .wx-id small { display: block; font-size: 12px; font-weight: 400; color: var(--subtext); margin-top: 2px; }
  .copy-btn {
    flex: none; border: 1.5px solid var(--accent); background: transparent;
    color: var(--accent); border-radius: 999px;
    padding: 6px 16px; font-size: 12px; font-weight: 600; cursor: pointer;
    font-family: inherit;
  }
  .copy-btn.copied { background: var(--accent); color: var(--accent-on); }
  .wechat .caption { margin-top: 12px; }

  /* ---- 5. 吸底转化条（双拼，仅上缘圆角，常驻） ---- */
  .cta-bar {
    position: sticky; bottom: 0;
    display: flex; align-items: stretch;
    margin: calc(var(--gap) + 12px) -16px -56px;
    border-radius: var(--r-card) var(--r-card) 0 0;
    overflow: hidden;
    box-shadow: 0 -6px 24px rgba(0,0,0,.08);
  }
  .cta-proof, .cta-action {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 16px 12px; font-size: 14px;
  }
  .cta-proof {
    background: color-mix(in srgb, var(--accent) 12%, var(--card));
    color: var(--accent); font-weight: 600;
  }
  .cta-action {
    background: var(--accent); color: var(--accent-on); font-weight: 700;
    cursor: pointer;
  }

  /* ---- 6. 页脚 ---- */
  .footer { margin-top: 20px; }
</style>
</head>

/* 单色噪点 / 纸纹（内联 SVG data URI，零外部依赖；不透明度 2-3% 量级） */
var TEXTURES = {
  noise: "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.05'/></svg>\")",
  paper: "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.35 0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='200' height='200' filter='url(%23p)' opacity='0.045'/></svg>\")"
};

var page = document.getElementById('page');
var themeBar = document.getElementById('themeBar');

function applyTheme(t) {
  var n = t.neutral, ty = t.typography, s = page.style;
  s.setProperty('--card', n.card);
  s.setProperty('--text', n.text);
  s.setProperty('--subtext', n.subtext);
  s.setProperty('--hairline', n.hairline);
  s.setProperty('--accent', t.accent);
  s.setProperty('--accent-on', t.accentOn);
  s.setProperty('--shadow', t.elevation.cardShadow);
  s.setProperty('--r-card', t.radius.card);
  s.setProperty('--r-avatar', t.radius.avatar);
  s.setProperty('--gap', t.grid.gap);
  s.setProperty('--d-size', ty.display.size + 'px');
  s.setProperty('--d-weight', ty.display.weight);
  s.setProperty('--d-track', ty.display.tracking);
  s.setProperty('--s-size', ty.section.size + 'px');
  s.setProperty('--s-weight', ty.section.weight);
  s.setProperty('--b-size', ty.body.size + 'px');
  s.setProperty('--b-weight', ty.body.weight);
  s.setProperty('--c-size', ty.caption.size + 'px');
  s.setProperty('--c-weight', ty.caption.weight);
  var tex = TEXTURES[t.texture];
  s.background = tex ? tex + ', ' + t.background.value : t.background.value;
  var pills = themeBar.querySelectorAll('.theme-pill');
  for (var i = 0; i < pills.length; i++) {
    pills[i].classList.toggle('active', pills[i].dataset.id === t.id);
  }
}

THEMES.forEach(function (t) {
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'theme-pill';
  b.dataset.id = t.id;
  b.setAttribute('aria-label', '切换主题：' + t.nameZh + '（' + t.nameEn + '）');
  b.innerHTML = '<span class="swatches" aria-hidden="true">' +
    '<i style="background:' + t.neutral.pageBg + '"></i>' +
    '<i style="background:' + t.neutral.card + '"></i>' +
    '<i style="background:' + t.accent + '"></i></span>' +
    '<span>' + t.nameZh + '</span>';
  b.addEventListener('click', function () { applyTheme(t); });
  themeBar.appendChild(b);
});

var layoutBtns = document.querySelectorAll('.layout-btn');
layoutBtns.forEach(function (btn) {
  btn.addEventListener('click', function () {
    page.dataset.layout = btn.dataset.layout;
    layoutBtns.forEach(function (b) { b.classList.toggle('active', b === btn); });
  });
});

/* 微信号复制（含降级路径，file:// 下也可用） */
var copyBtn = document.getElementById('copyBtn');
copyBtn.addEventListener('click', function () {
  var text = 'linxiaoman';
  function done() {
    copyBtn.textContent = '已复制';
    copyBtn.classList.add('copied');
    setTimeout(function () {
      copyBtn.textContent = '复制';
      copyBtn.classList.remove('copied');
    }, 1500);
  }
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    done();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else { fallback(); }
});

/* 支持 ?theme=<id>&layout=list|grid 直达（便于验收截图），默认 minimal-light + 列表 */
var params = new URLSearchParams(location.search);
var initial = THEMES[0];
for (var i = 0; i < THEMES.length; i++) {
  if (THEMES[i].id === params.get('theme')) { initial = THEMES[i]; break; }
}
applyTheme(initial);
if (params.get('layout') === 'grid') {
  page.dataset.layout = 'grid';
  layoutBtns.forEach(function (b) { b.classList.toggle('active', b.dataset.layout === 'grid'); });
}
</script>
